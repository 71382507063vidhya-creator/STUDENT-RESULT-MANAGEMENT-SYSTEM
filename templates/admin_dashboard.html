<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Student Result Management System</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="app-wrapper">
    <aside class="sidebar">
      <div class="brand">🎓 SRMS Admin</div>
      <nav class="nav flex-column py-2">
        <a class="nav-link active" href="/admin/dashboard"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
        <a class="nav-link" href="/admin/students"><i class="bi bi-people me-2"></i>Students</a>
        <a class="nav-link" href="/admin/subjects"><i class="bi bi-journal-bookmark me-2"></i>Subjects</a>
        <a class="nav-link" href="/admin/marks"><i class="bi bi-pencil-square me-2"></i>Marks</a>
        <a class="nav-link" href="/admin/results"><i class="bi bi-bar-chart me-2"></i>Results</a>
        <a class="nav-link logout-btn" href="#"><i class="bi bi-box-arrow-right me-2"></i>Logout</a>
      </nav>
    </aside>

    <div class="main-content">
      <div class="topbar">
        <div>
          <button class="btn btn-sm btn-light sidebar-toggle-btn"><i class="bi bi-list"></i></button>
          <span class="fw-semibold">Admin Dashboard</span>
        </div>
        <div class="text-muted">Welcome, {{ username }} 👋</div>
      </div>

      <div class="content-body">
        <div id="dashboard-alert"></div>

        <div class="row g-3 mb-4" id="dashboard-stats">
          <div class="col-md-4 col-lg-2">
            <div class="stat-card">
              <div class="stat-icon bg-primary-soft"><i class="bi bi-people"></i></div>
              <div><p class="stat-value" id="stat-total-students">-</p><p class="stat-label">Total Students</p></div>
            </div>
          </div>
          <div class="col-md-4 col-lg-2">
            <div class="stat-card">
              <div class="stat-icon bg-secondary-soft"><i class="bi bi-journal-bookmark"></i></div>
              <div><p class="stat-value" id="stat-total-subjects">-</p><p class="stat-label">Total Subjects</p></div>
            </div>
          </div>
          <div class="col-md-4 col-lg-2">
            <div class="stat-card">
              <div class="stat-icon bg-warning-soft"><i class="bi bi-clipboard-data"></i></div>
              <div><p class="stat-value" id="stat-total-results">-</p><p class="stat-label">Total Results</p></div>
            </div>
          </div>
          <div class="col-md-4 col-lg-2">
            <div class="stat-card">
              <div class="stat-icon bg-success-soft"><i class="bi bi-check-circle"></i></div>
              <div><p class="stat-value" id="stat-passed">-</p><p class="stat-label">Passed Students</p></div>
            </div>
          </div>
          <div class="col-md-4 col-lg-2">
            <div class="stat-card">
              <div class="stat-icon bg-danger-soft"><i class="bi bi-x-circle"></i></div>
              <div><p class="stat-value" id="stat-failed">-</p><p class="stat-label">Failed Students</p></div>
            </div>
          </div>
          <div class="col-md-4 col-lg-2">
            <div class="stat-card">
              <div class="stat-icon bg-primary-soft"><i class="bi bi-percent"></i></div>
              <div><p class="stat-value" id="stat-pass-percentage">-</p><p class="stat-label">Pass Percentage</p></div>
            </div>
          </div>
        </div>

        <div class="row g-3">
          <div class="col-lg-5">
            <div class="card-panel">
              <h6 class="fw-bold mb-3">Pass / Fail Overview</h6>
              <canvas id="resultChart" height="220"></canvas>
            </div>
          </div>
          <div class="col-lg-7">
            <div class="card-panel">
              <h6 class="fw-bold mb-3">Recent Results</h6>
              <div class="table-responsive">
                <table class="table align-middle">
                  <thead><tr><th>Name</th><th>Reg. No</th><th>Total</th><th>Grade</th><th>Status</th></tr></thead>
                  <tbody id="recent-results-body">
                    <tr><td colspan="5" class="text-center text-muted">Loading...</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.3/chart.umd.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
