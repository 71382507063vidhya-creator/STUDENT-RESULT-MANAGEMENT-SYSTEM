<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Student Result Management System</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="text-center mb-4">
        <div class="fs-1">🎓</div>
        <h4 class="fw-bold">Student Result Management System</h4>
      </div>

      <ul class="nav nav-pills auth-tabs justify-content-center mb-4" id="loginTabs" role="tablist">
        <li class="nav-item">
          <button class="nav-link active" id="student-tab" data-bs-toggle="pill" data-bs-target="#student-pane" type="button">Student</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="admin-tab" data-bs-toggle="pill" data-bs-target="#admin-pane" type="button">Admin</button>
        </li>
      </ul>

      <div class="tab-content">
        <div class="tab-pane fade show active" id="student-pane">
          <div id="student-login-alert"></div>
          <form id="student-login-form">
            <div class="mb-3">
              <label class="form-label">Register Number</label>
              <input type="text" class="form-control" id="student-register-number" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" id="student-password" required>
            </div>
            <button type="submit" class="btn btn-primary-custom w-100">Login</button>
          </form>
          <div class="text-center text-muted small mt-3">Demo: 23CS101 / pass123</div>
        </div>

        <div class="tab-pane fade" id="admin-pane">
          <div id="admin-login-alert"></div>
          <form id="admin-login-form">
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input type="text" class="form-control" id="admin-username" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" id="admin-password" required>
            </div>
            <button type="submit" class="btn btn-primary-custom w-100">Login</button>
          </form>
          <div class="text-center text-muted small mt-3">Demo: admin / admin123</div>
        </div>
      </div>

      <div class="text-center mt-4">
        <a href="/" class="text-decoration-none"><i class="bi bi-arrow-left"></i> Back to Home</a>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
