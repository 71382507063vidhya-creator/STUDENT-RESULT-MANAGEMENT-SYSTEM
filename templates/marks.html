<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marks | Student Result Management System</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="app-wrapper">
    <aside class="sidebar">
      <div class="brand">🎓 SRMS Admin</div>
      <nav class="nav flex-column py-2">
        <a class="nav-link" href="/admin/dashboard"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
        <a class="nav-link" href="/admin/students"><i class="bi bi-people me-2"></i>Students</a>
        <a class="nav-link" href="/admin/subjects"><i class="bi bi-journal-bookmark me-2"></i>Subjects</a>
        <a class="nav-link active" href="/admin/marks"><i class="bi bi-pencil-square me-2"></i>Marks</a>
        <a class="nav-link" href="/admin/results"><i class="bi bi-bar-chart me-2"></i>Results</a>
        <a class="nav-link logout-btn" href="#"><i class="bi bi-box-arrow-right me-2"></i>Logout</a>
      </nav>
    </aside>

    <div class="main-content">
      <div class="topbar">
        <div>
          <button class="btn btn-sm btn-light sidebar-toggle-btn"><i class="bi bi-list"></i></button>
          <span class="fw-semibold">Marks Management</span>
        </div>
      </div>

      <div class="content-body">
        <div id="marks-alert"></div>

        <div class="card-panel mb-3">
          <h6 class="fw-bold mb-3">Add Marks</h6>
          <form id="marks-form" class="row g-2 align-items-end">
            <div class="col-md-4">
              <label class="form-label">Student</label>
              <select class="form-select" id="marks-student" required></select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Subject</label>
              <select class="form-select" id="marks-subject" required></select>
            </div>
            <div class="col-md-2">
              <label class="form-label">Marks (0-100)</label>
              <input type="number" class="form-control" id="marks-value" min="0" max="100" required>
            </div>
            <div class="col-md-2">
              <button type="submit" class="btn btn-primary-custom w-100"><i class="bi bi-plus-lg"></i> Add</button>
            </div>
          </form>
        </div>

        <div class="card-panel">
          <h6 class="fw-bold mb-3">All Marks</h6>
          <div class="table-responsive">
            <table class="table align-middle">
              <thead><tr><th>Student</th><th>Subject</th><th>Marks</th><th>Actions</th></tr></thead>
              <tbody id="marks-body">
                <tr><td colspan="4" class="text-center text-muted">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
