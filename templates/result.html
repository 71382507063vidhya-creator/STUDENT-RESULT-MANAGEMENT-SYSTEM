<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Result | Student Result Management System</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/result.css') }}">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div id="result-wrapper">
      <div class="loading-spinner-wrap">
        <div class="spinner-border text-primary" role="status"></div>
      </div>
    </div>
  </div>

  <script>
    // Passed from Flask so results.js knows which student to fetch,
    // and where "Back to Dashboard" should point.
    window.RESULT_STUDENT_ID = {{ student_id }};
    window.RESULT_VIEWER = "{{ viewer }}";
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script src="{{ url_for('static', filename='js/chocolate-shower.js') }}"></script>
  <script src="{{ url_for('static', filename='js/results.js') }}"></script>
</body>
</html>
